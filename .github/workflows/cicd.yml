name: "skin-clear-cicd"

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Project
        run: mvn clean install -DskipTests

      - name: List target directory
        run: ls -al target

      - name: List project root
        run: ls -al

      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/skin-clear .
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/skin-clear:latest

  deploy:
    needs: build
    runs-on: [aws-ec2]
    steps:
      - name: Install Docker
        run: |
          if ! command -v docker &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            sudo usermod -aG docker $(whoami)
            sudo systemctl start docker
          fi
        shell: /usr/bin/bash -e {0}
      - name: Pull Image From DockerHub
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/skin-clear:latest
      - name: Delete Old Container
        run: sudo docker rm -f skin-clear-container || true
      - name: Run Docker Container
        run: sudo docker run -d -p 8080:8080 --name skin-clear-container ${{ secrets.DOCKERHUB_USERNAME }}/skin-clear:latest